---
name: Setup Build Environment
description: Install uv and Task into the runner (repo must already be checked out)

inputs:
  enable-uv:
    description: Whether to install uv
    required: false
    default: "true"
  enable-bats:
    description: Whether to install bats (only needed for the shell-test gate)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      if: inputs.enable-uv == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        repo-token: ${{ github.token }}

    - name: Install bats
      if: inputs.enable-bats == 'true'
      shell: bash
      # Fetched from bats-core rather than apt: the runner's Ubuntu mirrors
      # are a recurring outage source. The commit check pins content, not
      # just the (mutable) tag name.
      env:
        BATS_TAG: v1.14.0
        BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
      run: |
        set -euo pipefail
        src="${RUNNER_TEMP}/bats-core"
        git clone --quiet --depth 1 --branch "${BATS_TAG}" https://github.com/bats-core/bats-core.git "${src}"
        actual="$(git -C "${src}" rev-parse HEAD)"
        if [[ "${actual}" != "${BATS_COMMIT}" ]]; then
          echo "::error::bats-core ${BATS_TAG} resolved to ${actual}, expected ${BATS_COMMIT}"
          exit 1
        fi
        "${src}/install.sh" "${HOME}/.local"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
