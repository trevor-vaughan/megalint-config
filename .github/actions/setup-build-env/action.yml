---
name: Setup Build Environment
description: Install uv and Task into the runner (repo must already be checked out)

inputs:
  enable-uv:
    description: Whether to install uv
    required: false
    default: "true"
  enable-bats:
    description: Whether to install bats (only needed for the shell-test gate)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      if: inputs.enable-uv == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        repo-token: ${{ github.token }}

    - name: Install bats
      if: inputs.enable-bats == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y bats
