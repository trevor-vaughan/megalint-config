# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits. Driven by
# `task release:bump` (.taskfiles/scripts/release-bump.sh), which also reads
# `git-cliff --bumped-version` to suggest the next version.
#
# Only the settings that differ from `git-cliff --init` carry comments below.
# Everything else is the upstream default, kept verbatim so a future git-cliff
# upgrade diffs cleanly against a freshly generated file.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. The format is
generated from [Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org); do not edit it by hand — run
`task release:bump` instead.
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        {% set entry = commit.message | split(pat="%%SUB%%") %}\
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ entry | first | trim | upper_first }}\
        {% for sub in entry | slice(start=1) %}
            %%INDENT%%- {{ sub | trim | upper_first }}\
        {% endfor %}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # `trim` strips each release body's surrounding whitespace, so consecutive
    # releases would otherwise render with no blank line between them. Restore
    # the separator after rendering. The header already ends in a newline, so
    # the leading blank line this adds before the first release is the same
    # single separator every other release gets.
    { pattern = '(?m)^## \[', replace = "\n## [" },
    # `trim` also strips the template's own leading whitespace, so a nested
    # list marker cannot be indented in the template itself. The body emits
    # this sentinel instead and it becomes the indent here.
    { pattern = '%%INDENT%%', replace = "  " },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Only consider release tags. This repository also carries
# `riotbox-checkpoint/*` tags; without this pattern git-cliff tries to parse
# those as semver and aborts with
# "Semver error: unexpected character 'r' while parsing major version number".
tag_pattern = "v[0-9]*"
# Exclude commits that do not match the conventional commits specification.
# This is what keeps the historic "Version Bump" / "prep for v0.2.0" commits
# out of the changelog. Merge commits are excluded by the `merge_commit` parser
# below instead: preprocessing removes their subject, so by the time this
# applies there is nothing unconventional left to catch.
filter_unconventional = true
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
#
# Squash-merged branches carry their individual changes as a bullet list in the
# commit body. Splitting is what lets each of those bullets reach
# `commit_parsers` on its own and land under the group its own type selects,
# rather than being lost behind the squashed subject. The preprocessors below
# reduce the message to exactly the lines that should survive this split.
split_commits = true
# An array of regex based parsers to modify commit messages prior to further processing.
#
# These run before `split_commits`, so they see the whole raw message and are
# what makes splitting on newlines safe. Together they reduce a message to one
# line per change, discarding everything else. Order is significant.
#
# The Rust regex crate has no lookahead, so "delete the lines that are not
# conventional commits" cannot be written directly. Steps 5-7 mark the keepers,
# delete everything unmarked, then remove the marks.
commit_preprocessors = [
    # 1. Rejoin a word the author broke across a wrap. This has to precede the
    #    general unwrap below, which would otherwise leave a space inside the
    #    word. The trailing hyphen is kept: it is part of names like
    #    `multiprocessing-logging`.
    { pattern = '(?m)-\n[ \t]+([^-*\s])', replace = "-$1" },
    # 2. Unwrap hard-wrapped lines. A continuation is indented and does not
    #    start a new bullet, so it is folded back onto the line it belongs to.
    { pattern = '(?m)\n[ \t]+([^-*\s])', replace = " $1" },
    # 3. Fold each sub-bullet onto its parent's line behind a sentinel, so the
    #    split keeps them together. The body template splits them back apart.
    { pattern = '(?m)\n[ \t]+[-*][ \t]+', replace = " %%SUB%% " },
    # 4. Drop the list marker from top-level bullets, leaving the conventional
    #    commit at the start of the line where the parser expects it.
    { pattern = '(?m)^[-*][ \t]+', replace = "" },
    # 5. Mark every line that is a conventional commit. The subject is already
    #    one; the surviving body bullets became one in step 4.
    { pattern = '(?m)^((build|chore|ci|docs?|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?:)', replace = "%%KEEP%%$1" },
    # 6. Delete every unmarked line: prose paragraphs, plain bullets, and the
    #    subject of a merge commit. Only marked lines begin with `%`.
    { pattern = '(?m)^[^%\n].*$', replace = "" },
    # 7. Remove the marks now that only keepers remain.
    { pattern = '%%KEEP%%', replace = "" },
    # 8. Collapse the blank lines step 6 left behind, so the split does not
    #    yield empty commits.
    { pattern = '\n{2,}', replace = "\n" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    # A merge commit's body repeats the branch's own conventional subjects, and
    # the preprocessors above promote those into entries just as they do for a
    # squashed body. `filter_unconventional` no longer removes them, because
    # after preprocessing the merge subject is gone and what remains parses.
    # Skipping the merge commit outright keeps each change listed once.
    { field = "merge_commit", pattern = "true", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    # The release commit `release:bump` writes. Skipping it keeps the version
    # bump itself out of the *next* release's notes, so regenerating the whole
    # changelog later reproduces the same file.
    { message = "^chore\\(release\\)", skip = true },
    # `build` is grouped here rather than left to the `.*` catch-all: hoisting
    # body bullets surfaces the `build(...)` entries this project writes, and
    # they are maintenance work like the rest of this group.
    { message = "^build|^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false

[bump]
# Cargo-style 0.x semantics: while the major version is 0, a breaking change
# bumps the minor (0.5.0 -> 0.6.0) and a feature bumps the patch
# (0.5.0 -> 0.5.1). Nothing auto-suggests 1.0.0 — reaching 1.0 is a deliberate
# call the operator types at the prompt. Both flags default to true upstream,
# which would promote the first `BREAKING CHANGE` straight to v1.0.0.
features_always_bump_minor = false
breaking_always_bump_major = false
